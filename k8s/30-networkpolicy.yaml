# ガードレール②：egress をデフォルト拒否。許可は DNS のみ（デモでは MCP ゲートウェイ相当は省略）。
# 注意：NetworkPolicy を enforce する CNI が必要（kind 既定の kindnet でも enforce されることを確認済み。効かない場合は Calico / Cilium）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agent-egress, namespace: agents }
spec:
  podSelector: { matchLabels: { app: coding-agent } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
